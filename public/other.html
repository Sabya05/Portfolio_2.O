<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Other Websites</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #050816;
      color: white;
      padding: 50px 20px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 3rem;
      color: #22d3ee;
      margin-bottom: 15px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 50px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
    }

    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid #27272a;
      border-radius: 20px;
      padding: 25px;
      transition: all 0.3s ease;
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: #22d3ee;
      box-shadow: 0 0 25px rgba(34,211,238,0.3);
    }

    .card h2 {
      margin-bottom: 12px;
      font-size: 1.5rem;
    }

    .card p {
      color: #9ca3af;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      background: #22d3ee;
      color: black;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 600;
      transition: 0.3s;
    }

    .btn:hover {
      transform: scale(1.05);
    }
  </style>

</head>

<body>
